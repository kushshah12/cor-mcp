<div class="shelf">
  <div class="card"><p>One Plus 8</p><button>Buy</button><button>Save</button></div>

<!-- Same roles, different names: two groups, never one. -->
<ol>
  <li><span>Apples</span> <button>Buy</button></li>
  <li><span>Pears</span> <button>Buy</button></li>
  <li><span>Plums</span> <button>Buy</button></li>

  <li><span>Copper</span> <button>Sell</button></li>
</ol>
