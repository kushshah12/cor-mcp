<!doctype html>
<title>FAQ</title>
<style>.faq-item__answer { display: none } .faq-item.open .faq-item__answer { display: block } .faq-item__question { cursor: pointer }</style>
<!-- BrowserStack's FAQ: the items share a class, not a name; answers stay hidden until opened. -->
<div class="faqs">
  <div class="faq-item"><p class="faq-item__question">What is the cancellation policy?</p><div class="faq-item__answer">Cancellation stops the auto-renewal.</div></div>
  <div class="faq-item"><p class="faq-item__question">How secure is my payment?</p><div class="faq-item__answer">Payments are encrypted end to end.</div></div>
  <div class="faq-item"><p class="faq-item__question">Can I get invoices?</p><div class="faq-item__answer">Yes, from the billing page.</div></div>
</div>
<!-- Items with nothing to tell them apart. -->
<div class="tiles"><div class="tile"><span class="tile__icon">★</span></div><div class="tile"><span class="tile__icon">★</span></div></div>
<!-- Side-menu groups told apart only by an icon path: a path is not a name. -->
<div class="menu"><div class="menu-group" data-open-icon="/img/web.svg"><button class="menu-group__btn">Open</button></div><div class="menu-group" data-open-icon="/img/app.svg"><button class="menu-group__btn">Open</button></div></div>
<!-- Two prices per plan: the class alone does not pick one inside an item. -->
<div class="plans"><div class="plan"><h4 class="plan__name">Basic</h4><span class="plan__price">$5</span><span class="plan__price">$50</span></div><div class="plan"><h4 class="plan__name">Pro</h4><span class="plan__price">$9</span><span class="plan__price">$90</span></div></div>
<!-- A menu: each item holds only its link. Its own text as a template would add nothing. -->
<ul class="nav"><li class="nav__item"><a href="/a">Alpha</a></li><li class="nav__item"><a href="/b">Beta</a></li><li class="nav__item"><a href="/c">Gamma</a></li></ul>
<script>
  for (const q of document.querySelectorAll('.faq-item__question')) q.addEventListener('click', () => q.parentElement.classList.toggle('open'));
</script>
