<!doctype html>
<title>Plans</title>
<style>
  .grid { display: flex; gap: 12px } .card { border: 1px solid #ccc; padding: 8px; width: 220px }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle label { cursor: pointer; padding: 2px 6px; border: 1px solid #888 }
  .copies { display: none }
</style>
<!-- BrowserStack's plan cards: the Team card is named by its toggle label (no heading);
     Team Ultimate by an h3. Every card also exists as a hidden copy for other products. -->
<div class="grid">
  <div class="card">
    <div class="toggle"><input type="radio" id="t1" name="tv" checked><label for="t1">Team</label><input type="radio" id="t2" name="tv"><label for="t2">Team Pro</label></div>
    <p class="card__price">$150 / month</p><button>Choose</button>
    <h4 class="card__features">Desktop &amp; Mobile, plus:</h4>
  </div>
  <div class="card"><h3 class="card__title">Team Ultimate</h3><p class="card__price">$375 / month</p><button>Choose</button><h4 class="card__features">Bundle includes:</h4></div>
  <div class="card"><h3 class="card__title">Volume</h3><p>Inquire for pricing</p><button>Contact Sales</button></div>
</div>
<div class="copies">
  <div class="card"><h3 class="card__title">Team Ultimate</h3><p class="card__price">$299 / month</p><button>Choose</button></div>
</div>
