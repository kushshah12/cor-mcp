<!doctype html>
<title>Parent attribute</title>
<!-- P3 class page: repeated prices whose only distinguishing mark is a data-* on a wrapper two levels up (BrowserStack's
     Team / Team Pro price: [data-plan-key="team"] … .simplification-card__price-amount). -->
<div class="card-prices">
  <div class="price-slot" data-plan-key="team"><div class="price-wrap"><span class="price-amount">$29</span><span class="per">/mo</span></div></div>
  <div class="price-slot" data-plan-key="team_pro"><div class="price-wrap"><span class="price-amount">$39</span><span class="per">/mo</span></div></div>
  <div class="price-slot" data-plan-key="enterprise"><div class="price-wrap"><span class="price-amount">$99</span><span class="per">/mo</span></div></div>
</div>
