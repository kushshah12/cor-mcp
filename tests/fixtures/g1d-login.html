<!doctype html>
<title>G1d login</title>
<!-- G1d class page, mode "Forms behind a login (CRUD)": a sign-in form; a right password stores a session in
     sessionStorage and goes to /g1d-crud, which sends you back here without one. -->
<h1>Sign in</h1>
<form id="f">
  <label>Email <input name="email" type="email" autocomplete="username"></label>
  <label>Password <input name="password" type="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
  <p id="err" role="alert"></p>
</form>
<script>
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (f.get('password') !== 'secret') { document.getElementById('err').textContent = 'Wrong email or password'; return; }
    sessionStorage.setItem('session', f.get('email'));
    location.href = '/g1d-crud';
  };
</script>
