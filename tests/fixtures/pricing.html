<!doctype html>
<!-- The shape of browserstack.com/pricing (2026-09-24): a plan card and a
     comparison-table column both carry an <h3> "Team Ultimate" and a visible
     "Choose". Only the table tells them apart. -->
<title>Pricing</title>
<h1>Plans</h1>
<section>
  <div class="card"><span class="badge">TESTING TOOLKIT PACK</span><h3>Team Ultimate</h3>
    <p>$375 / month</p><input type="submit" value="Choose" data-plan-name="Testing Toolkit - Team Ultimate"></div>
  <div class="card"><h3>Volume</h3><button>Contact Sales</button></div>
</section>
<div>Detailed Plans Comparison</div>
<table><tbody><tr>
  <th><h3>Feature List</h3></th>
  <th><h3>Team Ultimate</h3><select><option>5 users | $75 per user</option></select>
    <input type="submit" value="Choose" data-plan-name="Testing Toolkit - Team Ultimate" data-product="Live"></th>
  <th><h3>Volume</h3><button>Contact Sales</button></th>
</tr></tbody></table>
<!-- Rows under one heading: the heading is the same for all, the row text is not. -->
<h2>Users</h2>
<ul>
  <li><span>Alice</span> <button>Delete</button></li>
  <li><span>Bob</span> <button>Delete</button></li>
</ul>
<!-- Truly identical: nothing but position differs. -->
<div><button>Help</button></div><div><button>Help</button></div>
