<!-- P1 class page: a cell named by a heading inside it — its only proven template is XPath (copy of scripts/conformance/fixtures/p3a-compare.html). -->
<!doctype html>
<title>Compare</title>
<style>.copy { display: none }</style>
<!-- BrowserStack's comparison table: a header table above several row tables sharing
     one class; header cells hold the plan name plus its price; row headers hold the
     feature name plus an info icon; full-width group rows; a hidden copy of the
     whole section for another product. -->
<div data-product-id="live">
  <section class="cmp">
    <table class="cmp__table">
      <thead><tr>
        <th scope="col"><span>Feature List</span></th>
        <th scope="col"><div class="toggle-wrap"><label><span class="toggle">Team</span></label><label><span class="toggle">Team Pro</span></label></div><p>$ 150 / month</p><h3 style="display:none">Large team?</h3></th>
        <th scope="col"><h3 class="plan">Team Ultimate</h3><p>$ 375 / month</p></th>
        <th scope="col"><p>$ 999+</p><span>Enterprise</span></th>
      </tr></thead>
    </table>
    <table class="cmp__table">
      <tr><th colspan="4">TESTING TOOLKIT UTILITIES</th></tr>
      <tr><th scope="row"><span class="feat">Bug Capture</span><img class="info" alt=""><p style="display:none">Generate detailed bug reports</p></th><td></td><td><img alt="Feature included"></td><td>Contact Sales</td></tr>
      <tr><th scope="row"><span class="feat">Visual Overlay</span><img class="info" alt=""></th><td></td><td><img alt="Feature included"></td><td>Contact Sales</td></tr>
    </table>
    <table class="cmp__table">
      <tr><th colspan="4">SUPPORT</th></tr>
      <tr><th scope="row"><span class="feat">Priority Support</span><img class="info" alt=""></th><td><img alt="Feature included"></td><td><img alt="Feature included"></td><td><img alt="Feature included"></td></tr>
    </table>
  </section>
</div>
<div class="copy" data-product-id="automate">
  <section class="cmp">
    <table class="cmp__table"><thead><tr><th scope="col"><span>Feature List</span></th><th scope="col"><h3 class="plan">Team</h3></th><th scope="col"><h3 class="plan">Team Ultimate</h3></th><th scope="col"><h3 class="plan">Enterprise</h3></th></tr></thead></table>
    <table class="cmp__table"><tr><th scope="row"><span class="feat">Bug Capture</span></th><td>x</td><td>y</td><td>z</td></tr></table>
  </section>
</div>
