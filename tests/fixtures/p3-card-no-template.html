<!doctype html>
<title>P3 per-card entries: no template</title>
<!-- Two prices SHOWN in a card: the class does not name one element per card. -->
<div class="a"><div class="tile"><h3>One</h3><p class="cost">$1</p><p class="cost">$2</p></div><div class="tile"><h3>Two</h3><p class="cost">$3</p></div></div>
<!-- Only one card holds the element: nothing to parameterise over. -->
<div class="b"><div class="box"><h3>Three</h3><p class="fee">$4</p></div><div class="box"><h3>Four</h3><p>Ask us</p></div></div>
