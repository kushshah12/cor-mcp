<!doctype html>
<title>P3b twin buttons where one class names one toggle state's button</title>
<style>.card { border: 1px solid #ccc; padding: 8px; margin: 4px; width: 220px } [hidden] { display: none }</style>
<!-- BrowserStack's Team card: live-team is the Team state's Choose, live-team-pro the Team Pro state's. A helper written with the first
     class finds a button that is hidden once the toggle moves. -->
<div class="card" data-testid="a"><h3>Alpha</h3><button class="go go-a">Choose</button><button class="go go-b" hidden>Choose</button></div>
<div class="card" data-testid="b"><h3>Beta</h3><button class="go go-a">Choose</button><button class="go go-b" hidden>Choose</button></div>
