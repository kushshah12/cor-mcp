<!doctype html>
<html>
<head><title>cwq-u7 leaf.text: a row action named by an sr-only span</title>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style></head>
<body>

        <td><button class="flex h-8 w-8 p-0 data-[state=open]:bg-muted"><svg width="16" height="16"></svg><span class="sr-only">Open menu</span></button></td>

  </table>
</body>
</html>
