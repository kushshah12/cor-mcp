<!doctype html>
<title>P3b tabs whose text a hidden tab repeats</title>
<!-- cy.contains('[role="tab"]', /^Live$/) takes the first match in the document, shown or not: here the hidden one -->
<div role="tablist" aria-label="Old" style="display:none"><button role="tab">Live</button></div>
<div role="tablist" aria-label="Product"><button role="tab" aria-selected="true">Live</button><button role="tab">Automate</button></div>
