<!doctype html>
<title>P3a label-named items</title>
<style>.faq { border-bottom: 1px solid #ccc; padding: 6px } .a { display: none } .faq.open .a { display: block }</style>
<!-- item.label: no attribute names an item; its question is its name. leaf.css: the question is a <p>, not a control -->
<ul>
  <li class="faq"><p class="faq__q">How do I pay?</p><p class="a">By card.</p></li>
  <li class="faq"><p class="faq__q">Can I cancel?</p><p class="a">Any time.</p></li>
  <li class="faq"><p class="faq__q">Is there a trial?</p><p class="a">Yes, 14 days.</p></li>
</ul>
