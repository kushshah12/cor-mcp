<!doctype html>
<title>P3a items holding a hidden twin of the target</title>
<style>.card { border: 1px solid #ccc; padding: 8px; margin: 4px; width: 200px } .sticky { display: none }</style>
<!-- `aria/Choose` finds hidden elements too, so it would take the first of two buttons inside a card: the renderer must use the CSS leaf -->
<div class="card"><h3>Alpha</h3><button class="primary">Choose</button><button class="sticky">Choose</button></div>
<div class="card"><h3>Beta</h3><button class="primary">Choose</button><button class="sticky">Choose</button></div>
<div class="card"><h3>Gamma</h3><button class="primary">Choose</button><button class="sticky">Choose</button></div>
