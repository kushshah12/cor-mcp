<!doctype html>
<title>P3b visible radios whose label text another label repeats</title>
<!-- cy.contains('label', /^Medium$/) takes the first label with that text: the stray one, before the radio's -->
<p><label>Medium</label></p>
<fieldset>
  <label><input type="radio" name="size" value="s" checked> Small</label>
  <label><input type="radio" name="size" value="m"> Medium</label>
</fieldset>
