<title>P3a names styled with text-transform</title>
<style>.tag { text-transform: uppercase } .row { padding: 4px }</style>
<!-- the renderer must decline: WebdriverIO getText() and the tag=text selector see the displayed text ("ALPHA") -->
<div class="row"><span class="tag">Alpha</span><button>Open</button></div>
<div class="row"><span class="tag">Beta</span><button>Open</button></div>
