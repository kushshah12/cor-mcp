<!doctype html>
<title>P3a attribute-named items</title>
<style>.card { border: 1px solid #ccc; padding: 8px; margin: 4px; width: 200px }</style>
<!-- item.attribute: a test id names each card; leaf.aria: the Buy button is named by its text -->
<div class="card" data-testid="sku-alpha"><h3>Alpha</h3><p class="price">$10</p><button>Buy</button></div>
<div class="card" data-testid="sku-beta"><h3>Beta</h3><p class="price">$20</p><button>Buy</button></div>
<div class="card" data-testid="sku-gamma"><h3>Gamma</h3><p class="price">$30</p><button>Buy</button></div>
